services:
  nginx:
    image: nginx:alpine
    ports: ["80:80"]
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [core-api]

  core-api:
    build: ./core-api
    env_file: .env
    depends_on: [postgres, redis]
    expose: ["8000"]

  inference-service:
    build: ./inference-service
    env_file: .env
    expose: ["8001"]

  worker-paysim-replay:
    build: ./workers
    command: python paysim_replay_producer.py
    env_file: .env
    depends_on: [redis]

  worker-paysim-consumer:
    build: ./workers
    command: python paysim_fraud_consumer.py
    env_file: .env
    depends_on: [redis, inference-service]

  worker-nepse-producer:
    build: ./workers
    command: python nepse_ingestion_producer.py
    env_file: .env
    depends_on: [redis]

  worker-nepse-consumer:
    build: ./workers
    command: python nepse_anomaly_consumer.py
    env_file: .env
    depends_on: [redis]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fraud_user
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: fraud_db
    volumes: ["pgdata:/var/lib/postgresql/data"]
    ports: ["5432:5432"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

volumes:
  pgdata:
